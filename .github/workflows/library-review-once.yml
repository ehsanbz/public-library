name: One-time review of existing books

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Saved campaign ID to resume; leave blank to start a new one-time snapshot
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    concurrency:
      group: public-library-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-reader.txt
      - name: Prepare or resume the fixed one-time snapshot
        env:
          REQUESTED_CAMPAIGN: ${{ inputs.campaign_id }}
        run: |
          python review_campaign.py prepare
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- review_campaign.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save fixed one-time review snapshot'
            git push origin HEAD:main
          fi
      - name: Check cloud authorization
        env:
          DRIVE_AUTH: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$DRIVE_AUTH" ]; then
            echo '::error::Add GOOGLE_DRIVE_CREDENTIALS_JSON to repository Actions secrets. See CLOUD_SETUP.md.'
            exit 1
          fi
      - name: Install book OCR and multilingual reader
        env:
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-deu libopenblas-dev
          python -m pip install -r requirements-reader.txt
      - name: Check synchronization safeguards
        run: |
          python test_sync_catalog.py
          python test_cloud_sync.py
          python test_content_reader.py
          python test_review_campaign.py
      - name: Read one-time review batch without moving Drive files
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
        run: python cloud_sync.py
      - name: Commit catalog metadata with concurrent-edit protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html catalog_data.json book_catalog.csv public_library_catalog.csv bookshelf_catalog.csv shervin_vakili_catalog.csv bookshelf_source.json vault_inventory.json metadata_source_order.json metadata_audit.json sync_config.json README.md review_campaign.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update both library vaults from Drive'
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo '::error::Main changed during synchronization; next run will retry from current metadata.'
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Prepare public site files only
        run: |
          mkdir -p site.local
          cp index.html catalog_data.json book_catalog.csv public_library_catalog.csv bookshelf_catalog.csv shervin_vakili_catalog.csv .nojekyll site.local/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site.local
      - name: Deploy catalog
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the live catalog
        run: python verify_cloud_deployment.py

  continue-once:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Continue only while this one-time snapshot has pending books
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python review_campaign.py continue
