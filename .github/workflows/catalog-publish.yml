name: Publish metadata-only catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-library-maintenance
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify access links are withheld
        run: python verify_public_privacy.py
      - uses: actions/configure-pages@v5
      - name: Prepare approved public files
        run: |
          mkdir site
          cp index.html .nojekyll site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy catalog
        id: deploy
        uses: actions/deploy-pages@v4
